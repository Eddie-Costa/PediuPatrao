# Configurando a conexão com MongoDB enquanto repositório de dados.
# Se a variável de ambiente MONGODB_URI não for definida, usa um Mongo local.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=pizzaria
# Definindo usuário e senha padrão para autenticação de usuário do sistema
#spring.main.allow-circular-references=true
spring.security.user.name=user
spring.security.user.password=123

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG
