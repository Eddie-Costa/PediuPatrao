<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Voltar aos pedidos</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Data e hora</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Entidade</th>
                        <th>ID</th>
                        <th>Operação</th>
                        <th>Valores anteriores</th>
                        <th>Valores novos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            Nenhum registro de auditoria encontrado.
                        </td>
                    </tr>
                    <tr th:each="registro : ${registros}">
                        <td class="ps-3" th:text="${registro.dataHora}"></td>
                        <td th:text="${registro.usuario}"></td>
                        <td th:text="${registro.perfil}"></td>
                        <td th:text="${registro.entidade}"></td>
                        <td th:text="${registro.entidadeId}"></td>
                        <td th:text="${registro.operacao}"></td>
                        <td><pre class="mb-0 small" th:text="${registro.valoresAnteriores}"></pre></td>
                        <td><pre class="mb-0 small" th:text="${registro.valoresNovos}"></pre></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
