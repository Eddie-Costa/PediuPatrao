<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produto</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/produtos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0"
            th:text="${produto.id != null} ? 'Editar produto' : 'Novo produto'">Novo produto</h2>
    </div>

    <div class="alert alert-danger" th:if="${erro}" role="alert" th:text="${erro}"></div>

    <div class="card shadow-sm" style="max-width: 600px;">
        <div class="card-body p-4">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo de produto</label>
                    <select id="tipo" class="form-select" th:field="*{tipo}" required>
                        <option value="">Selecione o tipo</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Esfiha">Esfiha</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome ou sabor</label>
                    <input id="nome" class="form-control" type="text" th:field="*{nome}"
                           maxlength="100" placeholder="Ex.: Calabresa, X-Tudo ou Coca-Cola" required>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label">Preço (R$)</label>
                    <input id="preco" class="form-control" type="number" th:field="*{preco}"
                           min="0" step="0.01" required>
                </div>

                <div class="form-check mb-4">
                    <input type="hidden" name="_ativo" value="on">
                    <input id="ativo" class="form-check-input" type="checkbox" name="ativo"
                           value="true" th:checked="${produto.ativo == null or produto.ativo}">
                    <label for="ativo" class="form-check-label">Produto ativo e disponível para pedidos</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Salvar produto
                    </button>
                    <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
